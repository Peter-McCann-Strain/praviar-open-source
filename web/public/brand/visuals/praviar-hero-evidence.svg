    <radialGradient id="mintEvidenceGlow" cx="72%" cy="25%" r="58%">
      <stop offset="0" stop-color="#5FB7A6" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#5FB7A6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5FB7A6" stop-opacity="0"/>
