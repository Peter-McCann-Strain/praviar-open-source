<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F4EF"/>
      <stop offset="0.46" stop-color="#F6F4EF"/>
      <stop offset="1" stop-color="#D7ECE5"/>
