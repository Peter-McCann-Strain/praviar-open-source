    <radialGradient id="copperRiskSignal" cx="88%" cy="68%" r="34%">
      <stop offset="0" stop-color="#B87333" stop-opacity=".22"/>
      <stop offset=".62" stop-color="#B87333" stop-opacity=".05"/>
      <stop offset="1" stop-color="#B87333" stop-opacity="0"/>
